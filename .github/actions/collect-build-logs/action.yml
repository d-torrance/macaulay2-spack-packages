name: Collect build logs
description: >
  Copy spack's per-package build logs, and any config.log, out of the stage
  directory and upload them as an artifact.  Meant to be called from a step
  guarded by `if: failure()`, when the logs are the only record of what went
  wrong -- spack discards the stage directory on success.

inputs:
  name:
    description: Artifact name.  Must be unique across the whole workflow run.
    required: true
  setup-env:
    description: >
      Path to spack's setup-env.sh.  The value is pasted into a bash script, so
      it may refer to $HOME -- which is what the macOS job needs, since its
      spack isn't at a fixed system path the way the containers' is.
    default: /opt/spack/share/spack/setup-env.sh

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        . "${{ inputs.setup-env }}"
        mkdir -p build-logs
        stages=$(spack location -S)
        # One package's logs would collide with another's -- they're all called
        # spack-build-out.txt -- so prefix each with the stage it came from.
        find "$stages" -name 'spack-build-*.txt' | while read -r log
        do cp "$log" "build-logs/$(basename $(dirname "$log"))-$(basename "$log")"
        done
        # config.log is where configure records why a test failed -- the
        # compiler or linker errors, or what a test program printed when it
        # wouldn't run -- and spack's own logs only show the verdict.  These sit
        # deeper (spack-src/M2/config.log, plus any bundled libraries'), so name
        # each after its whole path under the stage root.
        find "$stages" -name config.log | while read -r log
        do cp "$log" "build-logs/$(echo "${log#"$stages"/}" | tr / _)"
        done

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: build-logs
        # A failure before any package started building leaves nothing to
        # collect, and that shouldn't be reported as a second failure.
        if-no-files-found: ignore
