name: Build spack package

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIRROR: oci://ghcr.io/${{ github.repository_owner }}/macaulay2-spack-cache
  # Packages that tune themselves to the CPU they're built on, whatever
  # spack's target says: ntl's NATIVE=on adds -march=native, and msolve's
  # AX_EXT asks CPUID and adds -mavx512f and friends.  That's right for
  # spack, but GitHub's x86 runners mix CPUs with and without AVX-512, and
  # one of these built on an AVX-512 runner dies with "Illegal instruction"
  # on the rest.  Built without AVX-512, it runs on both.
  CPU_TUNED: ntl msolve

jobs:
  # Every job below must concretize to the same dependency hashes or the build
  # cache is useless, so resolve the moving develop branch to one commit here
  # and have everyone check out exactly that.
  #
  # Every job must also run the same spack, the latest release -- what users
  # actually run.  They all push to one build cache, and a newer spack can
  # write spec files an older one can't read, which breaks every
  # `buildcache update-index` until they're removed.  The Linux images are
  # tagged by release, so pinning the tag here pins both platforms.
  pin:
    name: Pin spack and spack-packages
    runs-on: ubuntu-latest
    outputs:
      builtin: ${{ steps.pin.outputs.sha }}
      spack: ${{ steps.pin.outputs.spack }}
    steps:
      - id: pin
        run: |
          sha=$(git ls-remote https://github.com/spack/spack-packages develop | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "spack-packages develop is $sha" >> "$GITHUB_STEP_SUMMARY"
          # Release tags only: no -rc or other prereleases.
          spack=$(git ls-remote --tags --refs https://github.com/spack/spack 'v*' |
              sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V | tail -1)
          echo "spack=$spack" >> "$GITHUB_OUTPUT"
          echo "spack is $spack" >> "$GITHUB_STEP_SUMMARY"

  # Build Macaulay2's dependencies once per distribution and push them to the
  # build cache, so the two jobs below share them.  The cache persists between
  # runs, so a later run only rebuilds what actually changed -- and a
  # dependency getting rebuilt is itself a signal worth noticing.
  deps:
    name: deps / ${{ matrix.platform.distribution }} ${{ matrix.platform.target }}
    needs: pin
    runs-on: ${{ matrix.platform.runner }}
    container:
      image: spack/${{ matrix.platform.distribution }}:${{ needs.pin.outputs.spack }}
    permissions:
      packages: write
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {distribution: almalinux8,   runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: almalinux9,   runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: ubuntu-jammy, runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: ubuntu-noble, runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: fedora40,     runner: ubuntu-latest,    target: x86_64_v3}
          # Same distribution and compiler as the x86_64 noble entry above, so
          # that a failure here points at the architecture and nothing else.
          - {distribution: ubuntu-noble, runner: ubuntu-24.04-arm, target: aarch64}
    steps:
      - uses: actions/checkout@v5

      - name: Set up spack
        run: |
          . /opt/spack/share/spack/setup-env.sh
          # TODO: drop the builtin checkout once macaulay2 and its dependencies
          # appear in a tagged spack-packages release; then we'd be testing what
          # an ordinary user actually gets.
          cd "$(spack location --repo builtin)"
          git fetch --depth 1 origin ${{ needs.pin.outputs.builtin }}
          git checkout ${{ needs.pin.outputs.builtin }}
          cd "$GITHUB_WORKSPACE"
          spack repo add spack_repo/macaulay2_ci
          spack mirror add --unsigned \
              --oci-username-variable GHCR_USER \
              --oci-password-variable GHCR_TOKEN cache "$MIRROR"
          # GitHub's runners are a mix of Intel and AMD, and spack would
          # otherwise concretize target= to whatever CPU it landed on -- so the
          # deps job and the build jobs could disagree and silently miss the
          # cache.  Both tiers must set this to the same thing.
          spack config add "packages:all:target:[${{ matrix.platform.target }}]"

      - name: Install dependencies
        # macaulay2@develop's dependencies are a superset of the release's: it
        # adds autoconf, automake and libtool and nothing else.  So one build
        # serves both specs.
        #
        # flex needs naming separately.  Once a mirror is configured, spack only
        # schedules a package's build dependencies when it actually misses the
        # cache, and --only dependencies prunes the root -- so macaulay2's own
        # build-only dependencies never get built here.  The rest of them
        # (autoconf, bison, texinfo, ...) arrive anyway as build dependencies of
        # something else in the graph; flex is the one nothing else wants, so
        # without this every job below would rebuild it from source.
        run: |
          . /opt/spack/share/spack/setup-env.sh
          spack install --verbose --only dependencies macaulay2@develop
          spack install --verbose flex

      - name: Push to build cache
        # Everything installed is named explicitly, and --only package keeps
        # push from walking dependencies on top of that: once the cache is
        # warm, build dependencies were never installed here -- their
        # dependents came down as binaries -- and pushing a spec that isn't
        # installed is an error.  The walk would also push the CPU-tuned
        # packages left out below, since other packages link to them.
        #
        # On an AVX-512 runner, leave those out.  A later run on a runner
        # without AVX-512 pushes them instead, and once cached they stay.
        run: |
          . /opt/spack/share/spack/setup-env.sh
          skip=" "
          if grep -qw avx512f /proc/cpuinfo
          then
            echo "::notice title=CPU-tuned packages not cached::AVX-512 runner, so not pushing $CPU_TUNED"
            skip=" $CPU_TUNED "
          fi
          spack buildcache push --unsigned --only package cache \
              $(spack find --format '{name} /{hash}' |
                awk -v skip="$skip" 'index(skip, " " $1 " ") == 0 { print $2 }')
          spack buildcache update-index cache

      - name: Collect build logs
        if: failure()
        uses: ./.github/actions/collect-build-logs
        with:
          name: build-logs-deps-${{ matrix.platform.distribution }}-${{ matrix.platform.target }}

  macaulay2:
    name: ${{ matrix.platform.distribution }} ${{ matrix.platform.target }} / ${{ matrix.spec }}
    needs: [pin, deps]
    # A matrix job counts as failed if any single leg fails, so without this one
    # distribution's dependency build going wrong would skip every build below
    # -- including the platforms whose dependencies were fine.  Only a missing
    # pin is genuinely fatal here; if this platform's dependencies aren't in the
    # cache, the build just rebuilds them from source.
    if: ${{ !cancelled() && needs.pin.result == 'success' }}
    runs-on: ${{ matrix.platform.runner }}
    container:
      image: spack/${{ matrix.platform.distribution }}:${{ needs.pin.outputs.spack }}
    permissions:
      packages: read
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {distribution: almalinux8,   runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: almalinux9,   runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: ubuntu-jammy, runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: ubuntu-noble, runner: ubuntu-latest,    target: x86_64_v3}
          - {distribution: fedora40,     runner: ubuntu-latest,    target: x86_64_v3}
          # Same distribution and compiler as the x86_64 noble entry above, so
          # that a failure here points at the architecture and nothing else.
          - {distribution: ubuntu-noble, runner: ubuntu-24.04-arm, target: aarch64}
        spec:
          # The release build takes builtin's --enable-documentation=download,
          # so it generates no examples; the development build has no docs to
          # download and so builds them, which runs every example in every
          # package.  That's where most functional problems turn up.
          - macaulay2@1.26.06
          - macaulay2@develop
    steps:
      - uses: actions/checkout@v5

      - name: Set up spack
        run: |
          . /opt/spack/share/spack/setup-env.sh
          cd "$(spack location --repo builtin)"
          git fetch --depth 1 origin ${{ needs.pin.outputs.builtin }}
          git checkout ${{ needs.pin.outputs.builtin }}
          cd "$GITHUB_WORKSPACE"
          spack mirror add --unsigned \
              --oci-username-variable GHCR_USER \
              --oci-password-variable GHCR_TOKEN cache "$MIRROR"
          # GitHub's runners are a mix of Intel and AMD, and spack would
          # otherwise concretize target= to whatever CPU it landed on -- so the
          # deps job and the build jobs could disagree and silently miss the
          # cache.  Both tiers must set this to the same thing.
          spack config add "packages:all:target:[${{ matrix.platform.target }}]"

      # Unconditional, and it has to stay that way: the deps job always adds
      # this repo, so anything it changes about the dependency graph -- right
      # now, gfan, which and mathicgb's tbb variant -- has to be visible here
      # too or the two tiers concretize differently and every dependency gets
      # rebuilt from source.  It's the release spec that needs saying: the
      # overlay's only *version* is develop, so it used to look like release
      # builds had no use for it.
      - name: Add overlay repo
        run: |
          . /opt/spack/share/spack/setup-env.sh
          spack repo add spack_repo/macaulay2_ci

      # Dependencies should all come from the cache the deps job pushed.  Try
      # that first and say so loudly if it didn't work: the failure is
      # otherwise invisible -- everything is quietly rebuilt from source and the
      # job still passes, just hours later.
      - name: Install dependencies from the build cache
        id: cache
        run: |
          . /opt/spack/share/spack/setup-env.sh
          label="${{ matrix.platform.distribution }} ${{ matrix.platform.target }} / ${{ matrix.spec }}"
          if spack install --only dependencies --use-buildcache dependencies:only ${{ matrix.spec }}
          then
            echo ":white_check_mark: **$label** -- all dependencies came from the build cache." \
                >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Build cache miss::$label: dependencies were not all in the build cache and are being rebuilt from source. Either one of $CPU_TUNED isn't cached yet, because the deps job ran on an AVX-512 runner, or the deps job and this job concretized differently -- check the spack-packages pin and the target pin."
            echo ":warning: **$label** -- build cache miss, rebuilding dependencies from source." \
                >> "$GITHUB_STEP_SUMMARY"
            spack install --verbose --only dependencies ${{ matrix.spec }}
          fi

      # Macaulay2 itself is always built from source.
      - name: Install Macaulay2
        run: |
          . /opt/spack/share/spack/setup-env.sh
          spack install --verbose --use-buildcache package:never ${{ matrix.spec }}

      - name: Run Macaulay2
        run: |
          . /opt/spack/share/spack/setup-env.sh
          spack load ${{ matrix.spec }}
          M2 --version
          M2 --script smoke-test.m2

      - name: Collect build logs
        if: failure()
        uses: ./.github/actions/collect-build-logs
        with:
          name: build-logs-${{ matrix.platform.distribution }}-${{ matrix.platform.target }}-${{ matrix.spec }}

  # macOS can't join the deps matrix above -- there is no spack container image
  # for it -- so it gets a dependency tier of its own.  Same bargain as on
  # Linux: build the dependencies once, push them, and let the two spec jobs
  # below pull binaries instead of spending hours rebuilding them twice.
  deps-macos:
    name: deps / macos
    needs: pin
    runs-on: macos-latest
    permissions:
      packages: write
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-spack-macos
        with:
          spack: ${{ needs.pin.outputs.spack }}
          builtin: ${{ needs.pin.outputs.builtin }}
          mirror: ${{ env.MIRROR }}

      - name: Install dependencies
        # Same two specs as the Linux deps job, for the same reasons: develop's
        # dependencies are a superset of the release's, and flex is the one
        # package nothing else in the graph pulls in as a build dependency.
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          spack install --verbose --only dependencies macaulay2@develop
          spack install --verbose flex

      - name: Push to build cache
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          spack buildcache push --unsigned --without-build-dependencies cache \
              $(spack find --format '/{hash}')
          spack buildcache update-index cache

      - name: Collect build logs
        if: failure()
        uses: ./.github/actions/collect-build-logs
        with:
          name: build-logs-deps-macos
          setup-env: $HOME/spack/share/spack/setup-env.sh

  # A mixed apple-clang/gfortran toolchain is still newer territory for these
  # packages than any of the Linux distributions above, and macOS is where the
  # last several dependency bugs turned up -- which is the argument for running
  # it, not for discounting it when it fails.
  macos:
    name: macos / ${{ matrix.spec }}
    needs: [pin, deps-macos]
    # As on the Linux build job: a failed dependency tier shouldn't skip the
    # builds, which can still fall back to building from source.
    if: ${{ !cancelled() && needs.pin.result == 'success' }}
    runs-on: macos-latest
    permissions:
      packages: read
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        spec:
          - macaulay2@1.26.06
          - macaulay2@develop
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-spack-macos
        with:
          spack: ${{ needs.pin.outputs.spack }}
          builtin: ${{ needs.pin.outputs.builtin }}
          mirror: ${{ env.MIRROR }}

      - name: Install dependencies from the build cache
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          label="macos / ${{ matrix.spec }}"
          if spack install --only dependencies --use-buildcache dependencies:only ${{ matrix.spec }}
          then
            echo ":white_check_mark: **$label** -- all dependencies came from the build cache." \
                >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Build cache miss::$label: dependencies were not all in the build cache and are being rebuilt from source. The deps job and this job concretized differently -- check the spack-packages pin and the target pin."
            echo ":warning: **$label** -- build cache miss, rebuilding dependencies from source." \
                >> "$GITHUB_STEP_SUMMARY"
            spack install --verbose --only dependencies ${{ matrix.spec }}
          fi

      - name: Install Macaulay2
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          spack install --verbose --use-buildcache package:never ${{ matrix.spec }}

      - name: Run Macaulay2
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          spack load ${{ matrix.spec }}
          M2 --version
          M2 --script smoke-test.m2

      - name: Collect build logs
        if: failure()
        uses: ./.github/actions/collect-build-logs
        with:
          name: build-logs-macos-${{ matrix.spec }}
          setup-env: $HOME/spack/share/spack/setup-env.sh
